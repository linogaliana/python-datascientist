name: Production deployment

on:
  push:
    branches:
      - main
      - parallel2

env:
  # Guard: keep 'false' so no run of this workflow publishes to GitHub Pages.
  PUBLISH_PAGES: 'false'

jobs:

  # ── 0. CI image ─────────────────────────────────────────────────────────────
  image:
    name: Build CI image
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml

  # ── 1. Parallel per-file rendering ──────────────────────────────────────────
  # The file list is read from project.render in _quarto-prod.yml, so it
  # stays the single source of truth.
  list-files:
    name: List files to render
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Extract project.render
        id: list
        run: echo "files=$(yq -o=json -I=0 '.project.render' _quarto-prod.yml)" >> "$GITHUB_OUTPUT"

  # Each .qmd file runs in its own job: installs deps, executes its Python
  # code, and uploads the resulting _freeze/ entries as an artifact.
  render-chunk:
    name: Render (${{ matrix.file }})
    runs-on: ubuntu-latest
    needs: [image, list-files]
    if: ${{ !github.event.pull_request.head.repo.fork }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.list-files.outputs.files) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Restore environment
        run: uv sync

      - name: Install SpaCy corpus and check Quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Prepare config
        run: |
          rm _quarto.yml
          cp _quarto-prod.yml _quarto.yml

      - name: Prepare environment metadata
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run build/append-environment/append_environment.py

      - name: Render file
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run quarto render "${{ matrix.file }}" --profile fr

      # Artifact names cannot contain '/', so derive a slug from the path.
      - name: Compute artifact name
        id: slug
        run: echo "name=$(echo '${{ matrix.file }}' | sed 's/\.qmd$//; s#[/.]#-#g')" >> "$GITHUB_OUTPUT"

      # _freeze/ entries are the execution results Quarto needs to skip
      # re-execution in the assembly step. Profile is not part of the freeze
      # path, so fr freeze entries are reused by the en render as well.
      - name: Upload freeze artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freeze-chunk-${{ steps.slug.outputs.name }}
          path: _freeze
          if-no-files-found: warn

  # ── 2. Site assembly and publication ────────────────────────────────────────
  # Downloads all freeze artifacts, merges them, then runs the two-profile
  # site render without re-executing any Python.
  # Quarto has no --freeze CLI flag: `freeze: true` is set in _quarto.yml
  # instead. Unlike `freeze: auto`, it reuses _freeze/ regardless of the
  # source-file hash, which is required here because append_environment.py
  # and sidebar.py both modify the .qmd files.
  pages:
    name: Assemble and publish
    runs-on: ubuntu-latest
    needs: render-chunk
    if: ${{ !github.event.pull_request.head.repo.fork }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Restore environment
        run: uv sync

      - name: Install SpaCy corpus and check Quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Prepare config
        run: |
          rm _quarto.yml
          cp _quarto-prod.yml _quarto.yml
          sed -i 's/^  freeze: auto$/  freeze: true/' _quarto.yml
          grep -q '^  freeze: true$' _quarto.yml

      - name: Prepare environment metadata
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run build/append-environment/append_environment.py

      # upload-artifact stores the *contents* of _freeze/ (no _freeze/ prefix),
      # so the artifacts are merged straight into _freeze/.
      - name: Download all freeze artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: freeze-chunk-*
          path: _freeze
          merge-multiple: true

      - name: Render website (fr)
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run quarto render --profile fr --to all

      - name: Switch sidebar to English
        run: uv run build/sidebar.py --to english

      - name: Render website (en)
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run quarto render --profile en --to all

      - name: Reset sidebar to French
        run: uv run build/sidebar.py --to french

      - name: Archive build as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitedir
          path: _site

      # Safety switch: publication is disabled while testing per-file
      # parallelism. Set PUBLISH_PAGES to 'true' at the top of this file to
      # re-enable it (still restricted to main).
      - name: Publish to Pages
        if: env.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.email quarto-github-actions-publish@example.com
          git config --global user.name "Quarto GHA Workflow Runner"
          quarto publish gh-pages . --no-render --no-browser

  # ── 3. Exercises and corrections (unchanged, run in parallel with above) ────
  enonces:
    name: Render exercises
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Install system dependencies
        run: sudo ./build/requirements.sh

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore environment
        run: uv sync

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Install SpaCy corpus and check quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Build and push notebooks
        uses: linogaliana/python-datascientist-actions@main
        with:
          destination-repository-name: python-datascientist-notebooks
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}

  corrections:
    name: Render corrections
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Install system dependencies
        run: sudo ./build/requirements.sh

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore environment
        run: uv sync

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Install SpaCy corpus and check quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Build and push notebooks
        uses: linogaliana/python-datascientist-actions-corrections@main
        with:
          destination-repository-name: py4ds-notebooks-corrections
          echo: true
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
