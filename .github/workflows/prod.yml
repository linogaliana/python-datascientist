name: Production deployment

on:
  push:
    branches:
      - main

jobs:

  # Rendering is split in two stages to go faster:
  # 1. render-chunk: one job per .qmd (list taken from project.render in
  #    _quarto-prod.yml) that executes the Python code and uploads _freeze/
  # 2. pages: merges every _freeze/ and renders the fr and en site
  #    without re-executing anything, then uploads _site/ as a Pages artifact
  # 3. deploy: publishes that artifact to GitHub Pages (no gh-pages branch,
  #    so no ever-growing history in the repository)
  # enonces and corrections build the notebooks independently.

  image:
    name: Build CI image
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml

  list-files:
    name: List files to render
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Extract project.render
        id: list
        run: echo "files=$(yq -o=json -I=0 '.project.render' _quarto-prod.yml)" >> "$GITHUB_OUTPUT"

  render-chunk:
    name: Render (${{ matrix.file }})
    runs-on: ubuntu-latest
    needs: [image, list-files]
    if: ${{ !github.event.pull_request.head.repo.fork }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.list-files.outputs.files) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Restore environment
        run: uv sync

      - name: Install SpaCy corpus and check Quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Prepare config
        run: |
          rm _quarto.yml
          cp _quarto-prod.yml _quarto.yml

      - name: Prepare environment metadata
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run build/append-environment/append_environment.py

      - name: Render file
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run quarto render "${{ matrix.file }}" --profile fr

      - name: Compute artifact name
        id: slug
        run: echo "name=$(echo '${{ matrix.file }}' | sed 's/\.qmd$//; s#[/.]#-#g')" >> "$GITHUB_OUTPUT"

      # freeze is shared between fr and en profiles
      - name: Upload freeze artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freeze-chunk-${{ steps.slug.outputs.name }}
          path: _freeze
          if-no-files-found: warn

  pages:
    name: Assemble and publish
    runs-on: ubuntu-latest
    needs: render-chunk
    if: ${{ !github.event.pull_request.head.repo.fork }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Restore environment
        run: uv sync

      - name: Install SpaCy corpus and check Quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Prepare config
        run: |
          rm _quarto.yml
          cp _quarto-prod.yml _quarto.yml
          # freeze: true because append_environment.py and sidebar.py modify the .qmd
          sed -i 's/^  freeze: auto$/  freeze: true/' _quarto.yml
          grep -q '^  freeze: true$' _quarto.yml

      - name: Prepare environment metadata
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run build/append-environment/append_environment.py

      - name: Download all freeze artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: freeze-chunk-*
          path: _freeze
          merge-multiple: true

      - name: Render website (fr)
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run quarto render --profile fr --to all

      - name: Switch sidebar to English
        run: uv run build/sidebar.py --to english

      - name: Render website (en)
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
        run: uv run quarto render --profile en --to all

      - name: Reset sidebar to French
        run: uv run build/sidebar.py --to french

      # Custom domain is configured in Settings > Pages, CNAME kept for safety
      - name: Add CNAME and .nojekyll
        run: |
          cp CNAME _site/CNAME
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: pages
    if: ${{ github.ref == 'refs/heads/main' && !github.event.pull_request.head.repo.fork }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  enonces:
    name: Render exercises
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Install system dependencies
        run: sudo ./build/requirements.sh

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore environment
        run: uv sync

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Install SpaCy corpus and check quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Build and push notebooks
        uses: linogaliana/python-datascientist-actions@main
        with:
          destination-repository-name: python-datascientist-notebooks
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}

  corrections:
    name: Render corrections
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{github.event.pull_request.head.repo.full_name}}

      - name: Configure safe.directory
        run: git config --global --add safe.directory /__w/python-datascientist/python-datascientist

      - name: Install system dependencies
        run: sudo ./build/requirements.sh

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore environment
        run: uv sync

      - name: Set up quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - name: Install SpaCy corpus and check quarto version
        run: |
          uv run spacy download en_core_web_sm
          uv run quarto --version

      - name: Build and push notebooks
        uses: linogaliana/python-datascientist-actions-corrections@main
        with:
          destination-repository-name: py4ds-notebooks-corrections
          echo: true
        env:
          TOKEN_API_INSEE: ${{ secrets.TOKEN_API_INSEE }}
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
