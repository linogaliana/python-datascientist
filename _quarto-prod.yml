profile:
  default: fr
  group: [fr, en]

execute:
  # voir _quarto.yml pour le détail: évite de réexécuter le code par profil
  freeze: auto




# WEBSITE ARCHITECTURE ---------------------


website:
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  navbar:
    background: "white"
    search: true
    title: false
    left:
      - file: index.qmd
        text: Home
      - sidebar:introduction
      - sidebar:manipulation
      - sidebar:communication
      - sidebar:modelisation
      - sidebar:NLP
      - sidebar:git
      - sidebar:appendix
    right:
      # - text: "{{< iconify octicon:person-16 title='Person' label='Credits' >}} Credits"
      #  href: credits.qmd
      - text: "{{< iconify octicon:mark-github-16 title='GitHub' label='GitHub' >}}"
        href: "#gitlink-widget"
        aria-label: "GitHub"
  comments:
    giscus:
      repo: linogaliana/python-datascientist
  twitter-card: true
  site-url: https://pythonds.linogaliana.fr
  repo-url: https://github.com/linogaliana/python-datascientist
  repo-branch: master
  issue-url: https://github.com/linogaliana/python-datascientist/issues/new
  repo-actions: [edit, issue]


format:
  html:
    # gitlink ne sert qu'au HTML (widget): en Typst il plante sur `bibliography`
    # (pandoc.utils.references lit un nom de fichier vide)
    filters:
      - path: gitlink
        at: post-quarto
    include-after-body: build/js/mac.html
    respect-user-color-scheme: true
    theme:
      light: [cosmo, styles/custom.scss, styles/custom-light.scss]
      dark: [cosmo, styles/custom.scss, styles/custom-dark.scss]
    css: styles/styles.css
    toc: true
    code-overflow: wrap
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px
    anchor-sections: true
    mainfont: "Open Sans"
    monofont: "JetBrains Mono"
    linestretch: 1.65
  typst:
    # Mise en forme des chapitres en PDF: voir styles/typst/README.md
    font-paths:
      - fonts
      - _extensions/quarto-ext/fontawesome/assets/webfonts
    papersize: a4
    fontsize: 10.5pt
    toc: true
    toc-depth: 2
    linkcolor: "#447099"
    highlight-style: atom-one-dark
    date-format: long
    filters:
      - styles/typst/resolve-remote-images.lua
      - styles/typst/inline-code.lua
    template-partials:
      - styles/typst/typst-template.typ
      - styles/typst/typst-show.typ
      - styles/typst/page.typ
    include-in-header:
      - styles/typst/style.typ
  ipynb: default

format-links:
  - html
  - format: typst
    text: PDF
    icon: file-pdf


# PAGE OPTIONS ---------------------

filters:
  - at: pre-ast
    path: _extensions/linogaliana/lang-switch/lang-notebook.lua
  - at: pre-ast
    path: _extensions/linogaliana/lang-switch/warninglang.lua
  - at: pre-ast
    path: _extensions/linogaliana/callout/callout-notebook.lua
  - include-code-files
  - build/replace-title.lua
  - _extensions/linogaliana/details-iframe/details.lua
  - _extensions/linogaliana/lang-switch/button.lua
extensions:
  gitlink:
    enabled: false
    platform: github               # Platform: github, gitlab, codeberg, gitea, bitbucket
    base-url: https://github.com   # Base URL (optional, auto-detected from platform)
    repository-name: linogaliana/python-datascientist    # Repository name for relative references
    widget:
      enabled: true
      style-navbar-tools: true

crossref:
  chapters: true

author: Lino Galiana
date: today
date-format: iso
page-layout: article
title-block-banner: "#e9f3fa"
number-sections: true
wrap: preserve
validate-yaml: false
keep-ipynb: true
lightbox: auto
google-scholar: true
commentable: true
highlight-style: a11y
